# ISDSRec ablation overlay
schema_version: 1
config_type: ablation_overlay
ablation_id: noise_matched_uniform
paper_name: "Noise-Matched Uniform"
paper_location: "Section 4.3.2 / Table 4(a)"
base_config_pattern: "configs/isdsrec/{dataset}.yaml"
intent:
  isolates: "interaction-specific temporal noise allocation"
  keeps_other_components_fixed: true
override:
  scheduling:
    enabled: true
    mode: "noise_matched_uniform"
    interaction_specific: false
    reference_schedule: "full_isdsrec_interaction_specific"
    matching:
      statistic: "mean_cumulative_noise_variance"
      scope: "valid_positions_within_each_sequence"
      frequency: "every_diffusion_step"
  recency_prior_usage:
    scheduler: "replaced_by_noise_matched_uniform"
    denoiser_conditioning: "original_elapsed_time_recency"
    preference_attention_bias: "original_elapsed_time_recency"
    gate_prior_statistics: "original_elapsed_time_recency"
  diffusion:
    enabled: true
    denoiser_enabled: true
    analytical_recovery_enabled: true
  preference_reconstruction:
    enabled: true
    adaptive_fusion_enabled: true

