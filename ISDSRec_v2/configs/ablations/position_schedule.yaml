# ISDSRec ablation overlay
schema_version: 1
config_type: ablation_overlay
ablation_id: position_schedule
paper_name: "Position-Based Schedule"
paper_location: "Section 4.3.2 / Table 4(a)"
base_config_pattern: "configs/isdsrec/{dataset}.yaml"
intent:
  isolates: "elapsed time versus sequence position as the scheduling signal"
  keeps_other_components_fixed: true
override:
  scheduling:
    enabled: true
    mode: "interaction_specific"
    prior_source: "normalized_distance_to_final_position"
    elapsed_time_used_for_scheduler: false
  recency_prior_usage:
    scheduler: "position_based_prior"
    denoiser_conditioning: "original_elapsed_time_recency"
    preference_attention_bias: "original_elapsed_time_recency"
    gate_prior_statistics: "original_elapsed_time_recency"
  diffusion:
    enabled: true
    denoiser_enabled: true
    analytical_recovery_enabled: true

